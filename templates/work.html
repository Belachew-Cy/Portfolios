<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work</title>
    <link rel="icon" href="{{ url_for('static', filename='img/Belachew-profile.jpg') }}" type="image/x-icon" />
    <!-- Google Font & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Your main stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}" />
</head>
<body>
    <div class="container">
        <!-- ======== NAVIGATION ======== -->
        <header class="navbar">
            <div class="logo">
              <i class="fas fa-shield-halved"></i> Portfolio
            </div>
            <nav class="nav-links">
                <a href="{{ url_for('get_all_posts') }}#home">Home</a>
                <a href="{{ url_for('get_all_posts') }}#work" class="active">Work</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('get_all_posts') }}#contact">Contact</a>
            </nav>
            <div class="nav-auth">
                {% if session.user %}
                    <form method="POST" action="{{ url_for('logout') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-outline">
                            <i class="fas fa-right-from-bracket"></i> Logout
                        </button>
                    </form>
                {% endif %}
            </div>
        </header>
<!-- ======== PAGE HEADER ======== -->
<div class="page-header">
    <h1>My <span>work</span></h1>
    <p>Security projects, implementations, and case studies from my analyst experience</p>
</div>
{% include "_work_section.html" %}
    <!-- ======== FOOTER ======== -->
        <footer>
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="footer-logo"><i class="fas fa-shield-halved"></i> Portfolio</span>
                <p class="footer-tagline">Secure. Fast. Thoughtfully built.</p>
            </div>
            <nav class="footer-nav" aria-label="Footer navigation">
                <a href="{{ url_for('get_all_posts') }}#home">Home</a>
                <a href="{{ url_for('get_all_posts') }}#work">Work</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('get_all_posts') }}#contact">Contact</a>
            </nav>
            <div class="social-links">
                <a href="https://github.com/Belachew-Cy" target="_blank" rel="noopener noreferrer" aria-label="GitHub" data-tooltip="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/belachew-cyber" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" data-tooltip="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://x.com/Belachew2153" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" data-tooltip="X"><i class="fab fa-x-twitter"></i></a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Copyright &copy; 2026 Belachew <i class="fas fa-heart"></i></p>
            <button class="footer-top" type="button" aria-label="Back to top"><i class="fas fa-arrow-up"></i> Back to top</button>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    </div>
</body>
</html>
