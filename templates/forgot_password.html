<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password | Belachew Buta</title>
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .container{min-height:auto;padding:2rem 1rem}
  .form-wrapper{max-width:420px;margin:2rem auto}
  .form-card{padding:2rem 1.75rem;border-radius:16px}
  .msg{padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem}
  .msg.success{color:#2e7d32;background:rgba(76,175,80,.12)}
  .msg.error{color:#e2555c;background:rgba(226,85,92,.1)}
  .form-footer{font-size:.9rem;text-align:center}
</style>
</head>
<body>
<div class="container"><div class="form-wrapper"><div class="form-card">
<h2><i class="fas fa-key"></i> Forgot Password</h2>
<p class="sub">Enter your email and we'll send you a reset link.</p>

{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, msg in messages %}<p class="msg {% if category=='success' %}success{% else %}error{% endif %}">{{ msg }}</p>{% endfor %}{% endif %}{% endwith %}

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group">
  <label for="email">Email Address</label>
  <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" maxlength="254">
</div>
<button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
</form>

<p class="form-footer" style="margin-top:1rem">
  <a href="{{ url_for('login') }}" style="color:var(--color-primary)">← Back to Login</a>
</p>
</div></div></div>
</body>
</html>
