<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | Belachew Buta</title>
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .container{min-height:auto;padding:2rem 1rem}
  .form-wrapper{max-width:420px;margin:2rem auto}
  .form-card{padding:2rem 1.75rem;border-radius:16px}
  .msg{padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem}
  .msg.success{color:#2e7d32;background:rgba(76,175,80,.12)}
  .msg.error{color:#e2555c;background:rgba(226,85,92,.1)}
</style>
</head>
<body>
<div class="container"><div class="form-wrapper"><div class="form-card">
<h2><i class="fas fa-lock-open"></i> Reset Password</h2>
<p class="sub">Choose a new password for your account.</p>

{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, msg in messages %}<p class="msg {% if category=='success' %}success{% else %}error{% endif %}">{{ msg }}</p>{% endfor %}{% endif %}{% endwith %}

<form method="POST" autocomplete="off">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group">
  <label for="password">New Password</label>
  <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
</div>
<div class="form-group">
  <label for="confirm_password">Confirm New Password</label>
  <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
</div>
<button type="submit" class="btn-submit"><i class="fas fa-check"></i> Reset Password</button>
</form>

<p class="form-footer" style="margin-top:1rem">
  <a href="{{ url_for('login') }}" style="color:var(--color-primary)">← Back to Login</a>
</p>
</div></div></div>
</body>
</html>
